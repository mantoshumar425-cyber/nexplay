<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXTPLAY AI Chat</title>
  <link rel="stylesheet" href="/chat-widget.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .chat-page {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }
    #nextplay-chat-button {
      display: inline-block;
      position: static;
      margin: 20px auto;
    }
    #nextplay-chat {
      text-align: left;
    }
  </style>
</head>
<body>
  <main class="chat-page">
    <h1>🎮 NEXTPLAY AI</h1>
    <p>Your AI assistant for coding, study, writing and ideas.</p>

    <button id="nextplay-chat-button"
            type="button"
            aria-controls="nextplay-chat"
            aria-expanded="false">
      💬 Chat with NEXTPLAY AI
    </button>

    <section id="nextplay-chat" aria-label="NEXTPLAY AI chat">
      <header>
        <strong>NEXTPLAY AI</strong>
        <button id="np-chat-close" type="button" aria-label="Close chat">✕</button>
      </header>

      <div id="np-chat-messages" aria-live="polite"></div>

      <form id="np-chat-form">
        <input id="np-chat-input"
               type="text"
               placeholder="Type your message..."
               autocomplete="off"
               required>
        <button id="np-chat-send" type="submit">Send</button>
      </form>

      <p id="np-chat-status" role="status">Ready</p>
    </section>
  </main>

  <script src="/chat-widget.js" defer></script>
</body>
</html>
